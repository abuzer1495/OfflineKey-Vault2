<!doctype html>
<!--
  index.html — the only file an end user opens (double-click, file:// URL).

  Everything runs locally in the browser; there is no server and no build step.
  Scripts are classic <script src> files (ES modules are blocked on file:// in
  Chrome) and are loaded in dependency order at the end of <body>.

  The Content-Security-Policy below is the network kill-switch:
    connect-src 'none'  -> no fetch/XHR/WebSocket/beacon can leave the page
    form-action 'none'  -> no form can be submitted anywhere
    default-src 'none'  -> anything not explicitly allowed (frames, objects,
                           media, remote images/fonts) is blocked
  Only scripts/styles shipped inside this folder may run; inline scripts and
  inline styles are not allowed, so injected markup cannot execute code.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OfflineKey Vault</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <noscript>JavaScript is required. / JavaScript gereklidir.</noscript>
  </div>

  <!-- 1. Third-party code (pinned, see vendor/VENDOR.md) -->
  <script src="vendor/wg-crypto.js"></script>      <!-- noble/scure crypto -> window.WGVendor -->
  <script src="vendor/qrcode.js"></script>         <!-- QR code matrix -->
  <script src="vendor/jspdf.umd.js"></script>      <!-- PDF writer -->
  <script src="vendor/dejavu-fonts.js"></script>   <!-- Unicode font for the PDF -->

  <!-- 2. Core: namespace, byte helpers, self-test registry + known-answer tests -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/bytes.js"></script>
  <script src="js/core/selftest.js"></script>
  <script src="js/core/selftest-vendor.js"></script>

  <!-- 3. Entropy: pool (the only secret-randomness source), collectors, KATs -->
  <script src="js/core/entropy-pool.js"></script>
  <script src="js/core/entropy-sources.js"></script>
  <script src="js/core/selftest-entropy.js"></script>

  <!-- 4. Wordlists, key derivation, coins (+ one start-up KAT per coin) -->
  <script src="js/data/monero-wordlist-english.js"></script>
  <script src="js/data/slip39-wordlist.js"></script>
  <script src="js/derive/bip39.js"></script>
  <script src="js/derive/hd.js"></script>
  <script src="js/derive/cardano-keys.js"></script>
  <script src="js/coins/registry.js"></script>
  <script src="js/coins/encode.js"></script>
  <script src="js/coins/bitcoin-family.js"></script>
  <script src="js/coins/account-coins.js"></script>
  <script src="js/coins/ed25519-coins.js"></script>
  <script src="js/coins/cardano.js"></script>
  <script src="js/coins/monero.js"></script>
  <script src="js/coins/selftest-coins.js"></script>

  <!-- 5. Optional security features and the wallet generator -->
  <script src="js/secure/slip39.js"></script>
  <script src="js/secure/bip38.js"></script>
  <script src="js/wallet/generator.js"></script>

  <!-- 6. User interface and output -->
  <script src="js/ui/i18n.js"></script>
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/help-texts.js"></script>
  <script src="js/ui/help.js"></script>
  <script src="js/output/qr.js"></script>
  <script src="js/ui/entropy-ui.js"></script>
  <script src="js/ui/generator-ui.js"></script>
  <script src="js/ui/result-ui.js"></script>
  <script src="js/output/pdf.js"></script>
  <script src="js/output/pdf-manual.js"></script>
  <script src="js/ui/pdf-preview.js"></script>
  <script src="js/ui/pdf-ui.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
